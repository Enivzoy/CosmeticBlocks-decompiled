name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew build --no-daemon

      - name: Rename jar to cb-version.jar
        run: |
          jar="$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)"
          cp "$jar" cb-version.jar
          ls -l cb-version.jar

      - name: Upload cb-version.jar
        uses: actions/upload-artifact@v4
        with:
          name: cb-version.jar
          path: cb-version.jar
          if-no-files-found: error
          archive: false
