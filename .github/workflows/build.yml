name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Rename to cb.jar
        run: |
          jar="$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)"
          cp "$jar" cb.jar
          ls -l cb.jar

      - name: cb.jar download
        uses: actions/upload-artifact@v7.0.2
        with:
          path: cb.jar
          if-no-files-found: error
          archive: false

      - name: Release Due?
        id: release_check
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        run: |
          last_tag="$(git describe --tags --abbrev=0 --match 'build-*' 2>/dev/null || true)"
          if [ -z "$last_tag" ]; then
            since="$(git rev-list --count HEAD)"
          else
            since="$(git rev-list --count "${last_tag}..HEAD")"
          fi
          total="$(git rev-list --count HEAD)"
          echo "Commits since last release: $since"
          if [ "$since" -ge 5 ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "tag=build-${total}" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      - name: New rlease
        if: steps.release_check.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.release_check.outputs.tag }}"
          cp cb.jar "cb-${tag}.jar"
          gh release create "$tag" "cb-${tag}.jar" \
            --target "$GITHUB_SHA" \
            --title "Build ${tag#build-}" \
            --generate-notes
